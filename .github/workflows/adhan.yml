name: adhan-fetch
on:
  push:
    branches: [adhan-fetch]
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Query Commons and download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out && cd out
          UA="NurVaktiBuild/1.0 (github.com/eakdemir3-prog/nur-vakti)"
          for f in "Beautiful_adhan.ogg" "Adhan_wiki.oga" "Azan.ogg" "33937_ejaz215_call-to-prayer-from-the-prophet-s-mo.ogg" "The_Adhan_-_Muslim_Call_to_Prayer_-_Aaqib_Azeez.mp3"; do
            curl -s -A "$UA" "https://commons.wikimedia.org/w/api.php?action=query&titles=File:$f&prop=imageinfo&iiprop=url|size|extmetadata|mime&format=json" > "meta_$f.json"
          done
          curl -s -A "$UA" "https://commons.wikimedia.org/w/api.php?action=query&list=search&srsearch=ezan%20OR%20adhan%20OR%20azan%20filetype:audio&srnamespace=6&srlimit=50&format=json" > search.json
          python3 - <<'P'
          import json,glob,urllib.request,os
          UA="NurVaktiBuild/1.0 (github.com/eakdemir3-prog/nur-vakti)"
          titles=[r["title"] for r in json.load(open("search.json"))["query"]["search"]]
          rep=[]
          q="|".join(titles[:50])
          url="https://commons.wikimedia.org/w/api.php?action=query&prop=imageinfo&iiprop=url|size|extmetadata|mime&format=json&titles="+urllib.parse.quote(q)
          data=json.load(urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":UA})))
          for p in data["query"]["pages"].values():
              ii=p.get("imageinfo",[{}])[0]; m=ii.get("extmetadata",{})
              g=lambda k:(m.get(k,{}).get("value","") or "")[:200]
              rep.append(dict(title=p["title"],url=ii.get("url"),size=ii.get("size"),dur=ii.get("duration"),mime=ii.get("mime"),lic=g("LicenseShortName"),artist=g("Artist"),desc=g("ImageDescription")))
          json.dump(rep,open("report.json","w"),ensure_ascii=False,indent=1)
          for r in rep:
              if r["url"] and r["size"] and r["size"]<15_000_000 and ("CC" in r["lic"] or "Public" in r["lic"] or "PD" in r["lic"]):
                  name="a_"+os.path.basename(r["url"])
                  open(name,"wb").write(urllib.request.urlopen(urllib.request.Request(r["url"],headers={"User-Agent":UA})).read())
          P
          ls -la
          tar czf adhan.tgz *
          gh release create "adhan-${{ github.run_number }}" adhan.tgz report.json --repo ${{ github.repository }} --target ${{ github.sha }} --prerelease --title adhan --notes adhan
